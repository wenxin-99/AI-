version: '3.8'

services:
  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uniproxy-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
      - GIN_MODE=release
    volumes:
      # 持久化数据
      - backend-data:/app/data
      # 配置文件（可选，用于自定义配置）
      - ./backend/config.yaml:/app/config.yaml:ro
    networks:
      - uniproxy-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # 前端服务
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: uniproxy-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - uniproxy-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # 数据库（可选，如果需要 MySQL）
  # mysql:
  #   image: mysql:8.0
  #   container_name: uniproxy-mysql
  #   restart: unless-stopped
  #   ports:
  #     - "3306:3306"
  #   environment:
  #     - MYSQL_ROOT_PASSWORD=your_root_password
  #     - MYSQL_DATABASE=uniproxy
  #     - MYSQL_USER=uniproxy
  #     - MYSQL_PASSWORD=your_password
  #     - TZ=Asia/Shanghai
  #   volumes:
  #     - mysql-data:/var/lib/mysql
  #   networks:
  #     - uniproxy-network
  #   healthcheck:
  #     test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 5

  # Redis（可选，用于缓存）
  # redis:
  #   image: redis:7-alpine
  #   container_name: uniproxy-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - uniproxy-network
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 5

networks:
  uniproxy-network:
    driver: bridge

volumes:
  backend-data:
    driver: local
  # mysql-data:
