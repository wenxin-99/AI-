version: '3.8'

# 开发环境 Docker Compose 配置
# 使用方法: docker-compose -f docker-compose.dev.yml up

services:
  # 后端开发服务
  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: uniproxy-backend-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Shanghai
      - GIN_MODE=debug
      - GO_ENV=development
    volumes:
      # 挂载源代码，支持热重载
      - ./backend:/app
      # Go 模块缓存
      - go-mod-cache:/go/pkg/mod
    networks:
      - uniproxy-network
    command: ["air", "-c", ".air.toml"]

  # 前端开发服务
  frontend-dev:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: uniproxy-frontend-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - TZ=Asia/Shanghai
      - NODE_ENV=development
    volumes:
      # 挂载源代码，支持热重载
      - ./client:/app
      # Node 模块缓存
      - node-modules:/app/node_modules
    networks:
      - uniproxy-network
    command: ["pnpm", "run", "dev", "--host"]

  # MySQL 数据库（开发环境）
  mysql-dev:
    image: mysql:8.0
    container_name: uniproxy-mysql-dev
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root123
      - MYSQL_DATABASE=uniproxy_dev
      - MYSQL_USER=uniproxy
      - MYSQL_PASSWORD=uniproxy123
      - TZ=Asia/Shanghai
    volumes:
      - mysql-dev-data:/var/lib/mysql
    networks:
      - uniproxy-network

  # Redis（开发环境）
  redis-dev:
    image: redis:7-alpine
    container_name: uniproxy-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    networks:
      - uniproxy-network

networks:
  uniproxy-network:
    driver: bridge

volumes:
  go-mod-cache:
    driver: local
  node-modules:
    driver: local
  mysql-dev-data:
    driver: local
  redis-dev-data:
    driver: local
