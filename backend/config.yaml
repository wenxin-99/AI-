server:
  host: "0.0.0.0"
  port: 2053
  mode: "debug"  # debug, release

database:
  type: "sqlite"  # sqlite, mysql
  sqlite:
    path: "./data/uniproxy.db"
  mysql:
    host: "localhost"
    port: 3306
    username: "root"
    password: ""
    database: "uniproxy"

jwt:
  secret: "uniproxy-secret-key-change-me-in-production"
