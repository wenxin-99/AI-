server:
  host: 0.0.0.0
  port: 2053
  base_path: /
  log_level: info
  tls:
    enabled: false
    cert_file: ""
    key_file: ""

database:
  type: sqlite
  path: /var/lib/uniproxy/uniproxy.db
  # MySQL配置(可选)
  # type: mysql
  # host: localhost
  # port: 3306
  # name: uniproxy
  # user: root
  # password: password

jwt:
  secret: change-this-secret-key-in-production
  expire_hours: 168  # 7天

xray:
  enabled: true
  binary_path: /usr/local/bin/xray
  config_path: /etc/uniproxy/xray.json
  log_path: /var/log/uniproxy/xray.log
  api_port: 10085

gost:
  enabled: true
  binary_path: /usr/local/bin/gost
  config_path: /etc/uniproxy/gost.yaml
  log_path: /var/log/uniproxy/gost.log
